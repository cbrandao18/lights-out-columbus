<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Specimen Tags</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Letter landscape, 2 x 3 tags per sheet, the same grid as the original specimen tag PDF. */
:root { --ink: #111; --muted: #555; --line: #999; --accent: #e2b007; --bg: #eef1ee; --font: "Atkinson Hyperlegible", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font); }
.controls { max-width: 11in; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
.controls h1 { margin: 0; font-size: 1.4rem; }
.controls p { margin: 0; color: var(--muted); max-width: 70ch; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row label { font-weight: 700; }
.row input { font: inherit; width: 5em; padding: 10px; border: 2px solid #ccc; border-radius: 10px; }
button { font: 700 1rem var(--font); border: 0; border-radius: 10px; padding: 12px 16px; min-height: 48px; cursor: pointer; background: #dfe4df; color: var(--ink); }
button.primary { background: var(--accent); }
.sheets { display: grid; gap: 16px; justify-items: center; padding-bottom: 32px; overflow-x: auto; }
.sheet { width: 11in; height: 8.5in; background: #fff; padding: 0.35in; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 0.3in 0.45in; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.tag { border: 1px dashed #bbb; padding: 0.12in 0.16in; display: grid; grid-template-columns: 1fr 1.05in; gap: 0.12in; }
.fields { display: grid; grid-template-columns: 1.3in 1fr; align-content: space-between; row-gap: 0.02in; font-size: 10.5pt; }
.fields b { font-weight: 700; align-self: end; white-space: nowrap; }
.fields span { border-bottom: 1px solid var(--line); min-height: 0.24in; align-self: end; }
.fields .id { font: 700 15pt var(--mono); letter-spacing: 0.08em; border-bottom: 0; line-height: 1; padding-bottom: 2px; }
.fields .contact { border: 0; font-size: 7.5pt; color: var(--muted); white-space: nowrap; }
.qr { display: grid; align-content: center; justify-items: center; gap: 3px; text-align: center; font-size: 7pt; color: var(--muted); }
.qr svg { width: 1.0in; height: 1.0in; display: block; }
@media print {
  @page { size: letter landscape; margin: 0; }
  body { background: #fff; }
  .controls { display: none; }
  .sheets { display: block; padding: 0; overflow: visible; }
  .sheet { box-shadow: none; page-break-after: always; break-after: page; }
}
</style>
</head>
<body>
<div class="controls">
  <h1>Specimen tags with QR codes</h1>
  <p>Each tag gets its own unique ID and a QR code. Scan the code with your phone camera to start a record in Collision Log with that ID already filled in. If the tag shows up in a bird photo, the app can read the ID from the photo too.</p>
  <div class="row">
    <label for="n">Sheets</label><input id="n" type="number" min="1" max="20" value="1" inputmode="numeric">
    <button type="button" id="regen">New IDs</button>
    <button type="button" class="primary" id="print">Print</button>
  </div>
  <p id="note"></p>
</div>
<div class="sheets" id="sheets"></div>
<script src="vendor/qrcode/qrcode.js"></script>
<script>
(function () {
  "use strict";
  var appUrl = new URL("./", location.href).href;
  var used = {};
  function newId() {
    var id;
    do { id = String(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000)); } while (used[id]);
    used[id] = 1; return id;
  }
  function qrSvg(text) {
    var q = qrcode(0, "M"); q.addData(text); q.make();
    return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  }
  function tag(id) {
    var url = appUrl + "?id=" + id;
    var t = document.createElement("div"); t.className = "tag";
    t.innerHTML =
      '<div class="fields">' +
        "<b>Species</b><span></span>" +
        '<b>Unique ID</b><span class="id">' + id + "</span>" +
        "<b>Date</b><span></span>" +
        "<b>Time</b><span></span>" +
        "<b>Building Name</b><span></span>" +
        "<b>Building Address</b><span></span>" +
        '<b>Contact</b><span class="contact">Lights Out Columbus, Mingesbruney.1@osu.edu</span>' +
      "</div>" +
      '<div class="qr">' + qrSvg(url) + "<div>Scan to log</div></div>";
    return t;
  }
  function build() {
    var n = Math.max(1, Math.min(20, parseInt(document.getElementById("n").value, 10) || 1));
    var box = document.getElementById("sheets"); box.textContent = ""; used = {};
    for (var s = 0; s < n; s++) {
      var sh = document.createElement("div"); sh.className = "sheet";
      for (var i = 0; i < 6; i++) sh.appendChild(tag(newId()));
      box.appendChild(sh);
    }
    document.getElementById("note").textContent = n * 6 + " tags. QR codes open " + appUrl;
  }
  document.getElementById("regen").addEventListener("click", build);
  document.getElementById("n").addEventListener("change", build);
  document.getElementById("print").addEventListener("click", function () { window.print(); });
  build();
})();
</script>
</body>
</html>
